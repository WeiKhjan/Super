<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07041a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="超时空英雄传说">
  <meta name="description" content="致敬 1996 年 DOS 经典战棋《超时空英雄传说》的手机网页重制版。">
  <title>超时空英雄传说 · 移动重制版</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- 作品选择（主画面） -->
  <section id="select" class="screen">
    <div class="select-inner">
      <div class="select-head">
        <div class="logo-sub">HEROES OF TIME &amp; SPACE · 系列合集</div>
        <h1>超时空英雄传说</h1>
        <div class="dim small">请选择要游玩的作品</div>
      </div>
      <div id="select-list"></div>
      <div class="title-foot">粉丝重制 · 致敬 宇峻科技<br><span class="dim">最佳体验：手机竖屏</span></div>
    </div>
  </section>

  <!-- 标题 -->
  <section id="title" class="screen" hidden>
    <canvas id="title-bg"></canvas>
    <div class="title-inner">
      <div class="logo">
        <div class="logo-sub" id="logo-sub">HEROES OF TIME &amp; SPACE</div>
        <h1 id="logo-title">超时空<br>英雄传说</h1>
        <div class="logo-tag" id="logo-tag">移动重制版 · 全 35 关</div>
      </div>
      <div id="title-heroes"></div>
      <div class="title-menu">
        <button class="btn big primary" id="btn-continue" hidden>继续旅程</button>
        <button class="btn big" id="btn-new">新的旅程</button>
        <button class="btn big" id="btn-help">游戏说明</button>
        <button class="btn" id="btn-diff">难度：标准</button>
        <button class="btn" id="btn-select">◀ 选择其他作品</button>
      </div>
      <div class="title-foot">粉丝重制 · 致敬 宇峻科技 <span id="logo-year">1996</span><br><span class="dim">最佳体验：手机竖屏</span></div>
    </div>
    <button class="icon-btn" id="btn-sound" aria-label="音效">🔊</button>
  </section>

  <!-- 战斗 -->
  <section id="battle" class="screen" hidden>
    <header id="hud">
      <div id="hud-title"></div>
      <div id="hud-turn"></div>
    </header>
    <div id="stage"><canvas id="map"></canvas></div>
    <footer id="panel">
      <div id="info"></div>
      <div id="actions"></div>
    </footer>
  </section>

  <!-- 营地 -->
  <section id="camp" class="screen" hidden>
    <header class="camp-head">
      <div><div class="dim small">下一战</div><div id="camp-next"></div></div>
      <div class="gold" id="camp-gold"></div>
    </header>
    <nav class="tabs">
      <button class="tab on" data-tab="party">队伍</button>
      <button class="tab" data-tab="items">道具</button>
      <button class="tab" data-tab="shop">商店</button>
    </nav>
    <div id="camp-body"></div>
    <footer class="camp-foot">
      <button class="btn" id="camp-title">存档并返回标题</button>
      <button class="btn" id="camp-auto">自动装备</button>
      <button class="btn primary big" id="camp-go">出击 ▶</button>
    </footer>
  </section>

  <!-- 结局 -->
  <section id="ending" class="screen" hidden>
    <div id="ending-scroll"></div>
  </section>

  <!-- 覆盖层 -->
  <div id="dialog" hidden>
    <div class="dlg-box">
      <div id="dlg-portrait"></div>
      <div class="dlg-main">
        <div id="dlg-name"></div>
        <div id="dlg-text"></div>
      </div>
      <div class="dlg-next">▼</div>
      <button id="dlg-skip" class="dlg-skip">跳过 ▶▶</button>
    </div>
  </div>
  <div id="duel" hidden><canvas id="duel-cv"></canvas></div>
  <div id="promo" hidden><canvas id="promo-cv"></canvas></div>
  <div id="chapter-card" hidden></div>
  <div id="banner"></div>
  <div id="modal" hidden></div>
  <div id="toast"></div>
</div>

<script src="js/data.js"></script>
<script src="js/stages/stages_01_09.js"></script>
<script src="js/stages/stages_10_18.js"></script>
<script src="js/stages/stages_19_27.js"></script>
<script src="js/stages/stages_28_35.js"></script>
<script src="js/story.js"></script>
<script src="js/campaigns.js"></script>
<script src="js/g2/data2.js"></script>
<script src="js/g2/stages_p1n.js"></script>
<script src="js/g2/stages_p1e2a.js"></script>
<script src="js/g2/stages_p2.js"></script>
<script src="js/g2/stages_p3a.js"></script>
<script src="js/g2/stages_p3b.js"></script>
<script src="js/g2/stages_p4.js"></script>
<script src="js/g3/data3.js"></script>
<script src="js/g3/stages_m1.js"></script>
<script src="js/g3/stages_m2.js"></script>
<script src="js/g3/stages_m3.js"></script>
<script src="js/g3/stages_f1.js"></script>
<script src="js/g3/stages_f2.js"></script>
<script src="js/g3/stages_f3.js"></script>
<script src="js/g3/stages_p4.js"></script>
<script src="js/sprites.js"></script>
<script src="js/sprites3.js"></script>
<script src="js/portraits.js"></script>
<script src="js/audio.js"></script>
<script src="js/battle.js"></script>
<script src="js/duelfig.js"></script>
<script src="js/duel.js"></script>
<script src="js/spellfx.js"></script>
<script src="js/promote.js"></script>
<script src="js/game.js"></script>
</body>
</html>
